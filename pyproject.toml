[project]
name = "ahorro"
version = "0.1.0"
description = "Página para elegir dónde poner los ahorros según el plazo: ETFs, inflación y volatilidad."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "yfinance>=0.2.50",
    "requests>=2.32",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

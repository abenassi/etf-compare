# Qué muestra la página. Cambiar un ETF = editar este archivo.
# Fuentes: "yahoo:<ticker>", "fred:<id>", "bce:<FLUJO/clave>", "bbk:<clave Bundesbank>".
# Proxies (se encadenan en orden, cada uno completa la historia anterior del previo):
#   {yahoo: X, moneda_cotiza, ter_diff}                         otro fondo o índice
#   {mezcla: [{yahoo: X, peso: 0.6}, ...], moneda_cotiza, ter_diff}  cartera con rebalanceo mensual
#   {bono: "bbk:<clave>", duracion: 2.0, moneda_cotiza, ter_diff}     bono sintético desde una tasa
#   {tasa: eur|usd, ter, moneda_cotiza}                           fondo que replica la tasa overnight
# ter_diff = TER del fondo - TER del proxy (negativo si el fondo es más barato).
# "antes" es el texto que ve la persona sobre qué se usó antes del dato real del fondo.
# tipo: escalera = ETFs con vencimiento fijo (moneda = la de sus tasas); no se bajan precios, se muestra el rendimiento al vencimiento por año.
# "hoy.ter" se resta del ytm para mostrar el rendimiento neto de comisión.
# "hoy.ytm" es el rendimiento al vencimiento de la ficha del emisor: se actualiza a mano (ver README).

desde: "2000-01"
fx: "bce:EXR/M.USD.EUR.SP00.E"        # dólares por 1 euro
cuenta: {spread: 0.5, piso: 0.0}      # cuenta remunerada = max(tasa de referencia - spread, piso)

tasas:
  # Tasa de referencia de corto plazo, % anual. Si hay varias, cada una pisa a la anterior desde que empieza.
  eur: ["bce:EON/D.EONIA_TO.RATE", "bce:EST/B.EU000A2X2A25.WT"]
  usd: ["fred:TB3MS"]

vistas:
  eur: {moneda: EUR, simbolo: "€", set: eur}
  usd: {moneda: USD, simbolo: "US$", set: usd}

grupos:
  - id: liq
    tag: Liquidez
    titulo: Plata a mano
    para: Para emergencias o gastos de los próximos meses. No crece mucho, pero no se cae.
  - id: med
    tag: Mediano plazo
    titulo: Ahorro para un objetivo
    para: Para algo que vas a comprar en 1 a 5 años, como un depto. Rinde algo más que una cuenta, sin sustos grandes.
  - id: jub
    tag: Jubilación
    titulo: Ahorro de largo plazo
    para: Para plata que no vas a tocar en 10 años o más. Sube y baja mucho, pero en el largo plazo es lo que más rinde.

sets:
  eur:
    liq:
      - nombre: Cuenta remunerada
        detalle: Banco o broker (Trade Republic, MyInvestor…)
        tipo: cuenta
        destacado: true
    med: &med
      - nombre: Bonos de empresas, corto plazo
        detalle: XZE5 · Xtrackers EUR Corporate Bond Short Duration (0-5 años)
        destacado: true
        yahoo: XZE5.DE
        moneda_cotiza: EUR
        proxy:
          - {yahoo: EUNT.DE, moneda_cotiza: EUR, ter_diff: -0.0004}
          - {bono: "bbk:BBSIS/M.I.ZST.ZI.EUR.S1311.B.A604.R02XX.R.A.A._Z._Z.A", duracion: 2.5, moneda_cotiza: EUR, ter_diff: 0.0016}
        antes: un fondo parecido (EUNT) y, antes de 2009, una aproximación con bonos del gobierno alemán a 2 años
        salto_max: 0.15
        # Sin dato publicado para XZE5: se usa el de EUNT (bonos de empresas 1-5 años), su referencia más cercana.
        hoy: {ytm: 0.0396, ter: 0.0016, fecha: "2026-10-16", fuente: "iShares € Corp Bond 1-5yr (EUNT)"}
      - nombre: Bonos con fecha de vencimiento
        detalle: iShares iBonds € Corp (acumulación) · elegí el año en que vas a necesitar la plata
        tipo: escalera
        moneda: EUR
        # Rendimiento al vencimiento bruto de la ficha de iShares; se actualiza a mano (ver README).
        fecha: "2026-10-19"
        escalera:
          - {vence: 2027, ticker: IB27, isin: IE000ZOI8OK5, ytm: 0.0334, ter: 0.0012}
          - {vence: 2028, ticker: IVOA, isin: IE0008UEVOE0, ytm: 0.0373, ter: 0.0012}
          - {vence: 2029, ticker: 29GA, isin: IE000SNLFDR7, ytm: 0.0387, ter: 0.0012}
          - {vence: 2030, ticker: 30IA, isin: IE000Y2BJVK9, ytm: 0.0403, ter: 0.0012}
          - {vence: 2031, ticker: IG31, isin: IE000D9WMGF0, ytm: 0.0420, ter: 0.0012}
          - {vence: 2032, ticker: IG32, isin: IE000I660ZF8, ytm: 0.0426, ter: 0.0012}
      - nombre: Bonos de gobiernos euro, 1 a 3 años
        detalle: IBCA · iShares € Govt Bond 1-3yr
        yahoo: IBCA.DE
        moneda_cotiza: EUR
        proxy:
          - {bono: "bbk:BBSIS/M.I.ZST.ZI.EUR.S1311.B.A604.R02XX.R.A.A._Z._Z.A", duracion: 1.9, moneda_cotiza: EUR, ter_diff: 0.001}
        antes: una aproximación con bonos del gobierno alemán a 2 años
        salto_max: 0.15
        hoy: {ytm: 0.0341, ter: 0.001, fecha: "2026-10-16"}
    jub: &jub
      - nombre: Acciones de todo el mundo
        detalle: VWCE · Vanguard FTSE All-World
        destacado: true
        yahoo: VWCE.DE
        moneda_cotiza: EUR
        proxy:
          - {yahoo: ACWI, moneda_cotiza: USD, ter_diff: -0.0013}
          - {mezcla: [{yahoo: VTSMX, peso: 0.6}, {yahoo: VGTSX, peso: 0.4}], moneda_cotiza: USD, ter_diff: 0.0}
        antes: un ETF del mismo tipo (ACWI) y, antes de 2008, fondos indexados de Vanguard (60% EE.UU., 40% resto del mundo)
        salto_max: 0.35
      - nombre: Acciones de países desarrollados
        detalle: IWDA/EUNL · iShares Core MSCI World
        yahoo: EUNL.DE
        moneda_cotiza: EUR
        proxy:
          - {yahoo: ACWI, moneda_cotiza: USD, ter_diff: -0.0012}
          - {mezcla: [{yahoo: VTSMX, peso: 0.6}, {yahoo: VGTSX, peso: 0.4}], moneda_cotiza: USD, ter_diff: 0.0}
        antes: un ETF de acciones del mundo (ACWI) y, antes de 2008, fondos indexados de Vanguard
        salto_max: 0.35
      - nombre: S&P 500 (EE.UU.)
        detalle: CSPX · iShares Core S&P 500
        yahoo: CSPX.AS
        moneda_cotiza: EUR   # el fondo es en USD, pero Yahoo publica la línea de Ámsterdam en EUR
        proxy: [{yahoo: "^SP500TR", moneda_cotiza: USD, ter_diff: 0.0007}]
        salto_max: 0.35
      - nombre: Nasdaq 100 (tecnológicas, más riesgo)
        detalle: CNDX · iShares Nasdaq 100
        yahoo: CNDX.AS
        moneda_cotiza: EUR   # el fondo es en USD, pero Yahoo publica la línea de Ámsterdam en EUR
        proxy: [{yahoo: QQQ, moneda_cotiza: USD, ter_diff: 0.001}]
        antes: QQQ, el ETF de EE.UU. que sigue el mismo índice
        salto_max: 0.35
  usd:
    liq:
      - nombre: Cuenta remunerada
        detalle: Banco o broker en EE.UU.
        tipo: cuenta
        destacado: true
      - nombre: Letras del Tesoro de EE.UU.
        detalle: BIL · SPDR Bloomberg 1-3 Month T-Bill
        yahoo: BIL
        moneda_cotiza: USD
        salto_max: 0.15
        proxy: [{tasa: usd, ter: 0.0014, moneda_cotiza: USD}]
        antes: la tasa de las letras del Tesoro a 3 meses menos la comisión
        grafico: true
        hoy: {tasa: true, ter: 0.0014}
    # Mediano y largo plazo: los mismos ETFs UCITS que en euros. Desde España no se pueden comprar ETFs de EE.UU.
    # (no tienen KID en español, PRIIPs), así que la vista en dólares solo reexpresa el rendimiento con el tipo de cambio.
    med: *med
    jub: *jub
